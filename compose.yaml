services:
  ml:
    build: .
    ports: ["8001:8001"]
    volumes: ["./artifacts/model:/app/artifacts/model:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  backend:
    build: .
    command: ["uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ML_URL: http://ml:8001
    ports: ["8000:8000"]
    depends_on:
      ml:
        condition: service_healthy
