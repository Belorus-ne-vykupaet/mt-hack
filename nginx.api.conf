server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /mockServiceWorker.js { add_header Cache-Control "no-store"; }
    location = /sw.js { add_header Cache-Control "no-store"; }
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }
    location /api/v1/ {
        proxy_pass http://api:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location /integration/v1/ {
        proxy_pass http://api:8081/api/v1/;
        proxy_set_header Host $host;
    }
}
