[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mt-hack"
version = "0.1.0"
description = "Causal 10-15 minute transport delay prediction"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.5,<3", "numpy>=2,<3", "pandas>=2.2,<4", "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2", "catboost>=1.2,<2", "pyarrow>=18",
  "fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.28"
]
[project.optional-dependencies]
dev = ["pytest>=8"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
