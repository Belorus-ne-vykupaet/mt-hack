name: Criteria audit

# Checks the main-stage criteria (PDF, criteria 1–5) the way the jury would:
# official archive → project tests → four containers from JURY_QUICKSTART →
# dashboard in a browser → container faults and the organizers' NDTP emulator.
# The audited code is the branch head: zhenya = main + these tests.
on:
  workflow_dispatch:
  push:
    branches: [zhenya]
    paths:
      - "tests/criteria/**"
      - "tests/criteria-e2e/**"
      - "scripts/criteria/**"
      - "playwright.criteria.config.ts"
      - ".github/workflows/criteria-audit.yml"

concurrency:
  group: criteria-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CRITERIA_REPORT_DIR: reports/criteria
      CRITERIA_REPLAY_STEP: "60"
      PYTHONPATH: ml:src
      # server/weather-demo.env holds a shared paid key: never use it in the audit.
      YANDEX_WEATHER_KEY: ""
      WEATHER_ENABLED: "false"
      GIGACHAT_AUTH_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Machine
        run: |
          mkdir -p reports/criteria
          { nproc; grep -m1 "model name" /proc/cpuinfo; free -h | head -2; docker --version; } | tee reports/criteria/machine.txt
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Python dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ml/requirements.txt pyyaml
      # The organizers' archive is downloaded on the runner only; raw data never
      # reaches the artifacts. No cache: the documented download is tested every run.
      - name: Official archive (JURY_QUICKSTART step 1)
        run: |
          if python3 scripts/prepare-official-data.py --save-archive ml/data/official-dataset.zip > reports/criteria/jury-step1.log 2>&1; then
            echo '{"jury_step_1": "ok"}' > reports/criteria/jury-step1.json
          else
            echo "{\"jury_step_1\": \"failed\", \"error\": \"$(tail -1 reports/criteria/jury-step1.log | tr -d '"')\"}" > reports/criteria/jury-step1.json
          fi
          cat reports/criteria/jury-step1.json
          sha256sum ml/data/official-dataset.zip | tee reports/criteria/dataset-sha256.txt
          unzip -l ml/data/official-dataset.zip | head -25 | tee reports/criteria/archive-listing.txt
          python3 tests/criteria/flatten_archive.py ml/data/official-dataset.zip
          sha256sum ml/data/official-dataset.zip | tee -a reports/criteria/dataset-sha256.txt
          python3 -c "import json,hashlib; m=json.load(open('ml/artifacts/data-manifest.json')); h=hashlib.sha256(open('ml/data/official-dataset.zip','rb').read()).hexdigest(); print(json.dumps({'matches_team_manifest': h == m['archiveSha256']}))" | tee reports/criteria/dataset-manifest-check.json
          python3 scripts/prepare-official-data.py --archive ml/data/official-dataset.zip

      - name: The project's own Python tests
        continue-on-error: true
        run: python -m pytest ml/tests tests/test_causality.py tests/test_submission.py -q -rs -p no:cacheprovider --junitxml=reports/criteria/project-python-tests.xml
      - name: Criteria tests 1, 2, 3, 5 (Python)
        id: python_criteria
        continue-on-error: true
        run: python -m pytest tests/criteria -q -rsxX -p no:cacheprovider --junitxml=reports/criteria/criteria-python.xml

      - name: Four containers exactly as in JURY_QUICKSTART
        id: stack
        continue-on-error: true
        run: |
          export API_TOKEN="$(openssl rand -hex 32)"
          echo "API_TOKEN=$API_TOKEN" >> "$GITHUB_ENV"
          start=$(date +%s)
          node scripts/start-official-docker.mjs -d
          for i in $(seq 1 180); do
            curl -fs http://127.0.0.1:8081/api/v1/health >/dev/null && curl -fs http://127.0.0.1:8080/ >/dev/null && break
            sleep 2
          done
          echo "{\"build_and_start_seconds\": $(( $(date +%s) - start ))}" | tee reports/criteria/jury-start.json
          docker compose -f compose.official.yaml ps

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Dashboard on the official stand (criterion 4)
        id: dashboard
        continue-on-error: true
        env:
          CRITERIA_MODE: official
          CRITERIA_BASE_URL: http://127.0.0.1:8080
          CRITERIA_ALLOW_DOCKER_MUTATION: "1"
          CRITERIA_PW_OUTPUT: reports/criteria/playwright-official
        run: pnpm exec playwright test --config playwright.criteria.config.ts

      - name: Container audit (criteria 2, 3, 5)
        id: containers
        continue-on-error: true
        env:
          CRITERIA_ALLOW_DOCKER_MUTATION: "1"
        run: node scripts/criteria/docker-audit.mjs

      - name: Frontend-only deployment (README `docker compose up`)
        id: frontend_only
        continue-on-error: true
        env:
          CRITERIA_BASE_URL: http://127.0.0.1:8080
          CRITERIA_NO_API: "1"
          CRITERIA_PW_OUTPUT: reports/criteria/playwright-demo
        run: |
          docker compose -f compose.official.yaml down
          docker compose up -d --build
          for i in $(seq 1 90); do curl -fs http://127.0.0.1:8080/ >/dev/null && break; sleep 2; done
          pnpm exec playwright test --config playwright.criteria.config.ts

      - name: Logs
        if: always()
        run: |
          docker compose -f compose.official.yaml logs --no-color --tail 300 > reports/criteria/official-stack.log 2>&1 || true
          docker compose logs --no-color --tail 100 > reports/criteria/frontend-only.log 2>&1 || true
          # Only aggregated results leave the runner: no organizers' CSV or images.
          find reports/criteria -type f -name "*.csv" -delete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criteria-audit
          path: reports/criteria/
      - name: Summary
        if: always()
        run: |
          {
            echo "## Criteria audit"
            echo "| step | outcome |"; echo "|---|---|"
            echo "| Python criteria 1,2,3,5 | ${{ steps.python_criteria.outcome }} |"
            echo "| Jury start (4 containers) | ${{ steps.stack.outcome }} |"
            echo "| Dashboard (official) | ${{ steps.dashboard.outcome }} |"
            echo "| Container audit | ${{ steps.containers.outcome }} |"
            echo "| Frontend-only deployment | ${{ steps.frontend_only.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
